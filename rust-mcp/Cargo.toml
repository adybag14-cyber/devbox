[package]
name = "devbox-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust replacement for Docker ChatGPT Devbox MCP"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
rmcp = { version = "3.1.2", features = ["transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
