version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust-mcp-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      node-runtime-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions-routine:
        patterns: ["*"]
