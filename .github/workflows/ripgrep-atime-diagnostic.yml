name: Diagnose pinned ripgrep access-time fixtures

on:
  push:
    branches: [codex/ripgrep-atime-20261026]
    paths:
      - .github/workflows/ripgrep-atime-diagnostic.yml
      - .github/scripts/ripgrep-atime-diagnostic.py

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: BurntSushi/ripgrep
          ref: e89fff89ac9af12e8d4ce9d5fd07beb408ca730f
          path: .cpp-build/atime-source
          persist-credentials: false
      - name: Install pinned build compiler
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Record fixture timestamps and reproduce ordering failures
        run: python3 .github/scripts/ripgrep-atime-diagnostic.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Qualify deterministic timestamp fixtures and unchanged runtime
        run: |
          node --test cpp-mcp/scripts/ripgrep-fixtures.test.mjs
          node cpp-mcp/scripts/build-ripgrep.mjs
          cp .cpp-build/bundled-ripgrep/manifest.json .cpp-build/atime-evidence/corrected-manifest.json
          cp .cpp-build/bundled-ripgrep/upstream-integration.log .cpp-build/atime-evidence/corrected-upstream-integration.log
      - name: Preserve diagnostics even if a check fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ripgrep-atime-macos-arm64
          path: .cpp-build/atime-evidence/
          if-no-files-found: error
          retention-days: 14
