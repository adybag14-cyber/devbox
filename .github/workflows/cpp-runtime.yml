name: Registry cache diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: ./.github/actions/docker-cache
      - name: Use isolated anonymous credentials for public images
        run: |
          public_config_dir=$(mktemp -d "${RUNNER_TEMP}/devbox-public-docker.XXXXXX")
          printf '{"auths":{}}\n' > "${public_config_dir}/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$public_config_dir" >> "$GITHUB_ENV"
      - name: Record registry configuration
        run: |
          docker version
          docker info --format '{{json .RegistryConfig}}'
      - name: Pull through canonical Docker Hub name
        continue-on-error: true
        run: docker --debug pull alpine:3.23
      - name: Probe cache manifest and direct image resolution
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 15 -D /tmp/cache-headers -o /tmp/cache-manifest -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' 'https://mirror.gcr.io/v2/library/alpine/manifests/3.23?ns=docker.io'
          sha256sum /tmp/cache-manifest
          cat /tmp/cache-headers
          docker --debug pull mirror.gcr.io/library/alpine:3.23
      - name: Bounded daemon diagnostics
        if: always()
        run: sudo journalctl -u docker --since '10 minutes ago' --no-pager --lines 120
