name: Platform runtime E2E

# The C++ workflow is the shared build and integration authority. Automatic
# branch/PR checks run there; this retained entry point supports manual reruns.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Native C++ platforms, installer and Guardian
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/cpp-runtime.yml
