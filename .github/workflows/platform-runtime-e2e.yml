name: Platform runtime E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "rust-mcp/**"
      - "rust-toolchain.toml"
      - "bin/**"
      - "scripts/**"
      - "bootstrap/**"
      - "setup-tui/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/platform-runtime-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    name: Native Windows Guardian + Rust MCP E2E
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select Rust 1.91.1
        shell: pwsh
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          rustc --version
          cargo --version
      - name: Validate native Windows launcher, Guardian tasks and Rust MCP lifecycle
        shell: pwsh
        run: ./scripts/ci/run-windows-runtime-e2e.ps1

  macos-native:
    name: Native macOS E2E (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Select Rust 1.91.1
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          rustc --version
          cargo --version
      - name: Validate native macOS runtime and MCP bridge
        env:
          DEVBOX_E2E_EXPECT_PLATFORM: macos
          DEVBOX_E2E_PORT: 18180
        run: sh scripts/ci/run-posix-runtime-e2e.sh

  linux-distros:
    name: Linux E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 LTS
            image: ubuntu:26.04
            family: apt
          - name: Debian 13
            image: debian:13
            family: apt
          - name: Fedora 44
            image: fedora:44
            family: dnf
          - name: Alpine 3.23
            image: alpine:3.23
            family: apk
          - name: Arch Linux rolling
            image: archlinux:base
            family: pacman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate distro runtime and MCP bridge
        run: sh scripts/ci/run-linux-distro-container-e2e.sh "${{ matrix.image }}" "${{ matrix.family }}"

  termux-docker:
    name: Official Termux Docker full E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate full Termux bootstrap, TUI, launcher, Guardian and MCP bridge
        env:
          TERMUX_DOCKER_IMAGE: termux/termux-docker:x86_64
          DEVBOX_E2E_PORT: 18182
        run: sh scripts/ci/run-termux-docker-e2e.sh
