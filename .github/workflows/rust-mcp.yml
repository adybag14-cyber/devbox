name: Rust MCP replacement

on:
  push:
    branches: [main]
    paths:
      - "rust-mcp/**"
      - "rust-toolchain.toml"
      - "src/server.js"
      - "src/launcher.js"
      - "src/mcp-implementation.js"
      - "scripts/Start-ChatGptDevboxMcp.ps1"
      - "scripts/Stop-ChatGptDevboxMcp.ps1"
      - "scripts/ci/test-windows-startup-contract.ps1"
      - "scripts/ci/test-windows-managed-mcp-ownership.ps1"
      - ".github/workflows/rust-mcp.yml"
  pull_request:
    paths:
      - "rust-mcp/**"
      - "rust-toolchain.toml"
      - "src/server.js"
      - "src/launcher.js"
      - "src/mcp-implementation.js"
      - "scripts/Start-ChatGptDevboxMcp.ps1"
      - "scripts/Stop-ChatGptDevboxMcp.ps1"
      - "scripts/ci/test-windows-startup-contract.ps1"
      - "scripts/ci/test-windows-managed-mcp-ownership.ps1"
      - ".github/workflows/rust-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-mcp:
    name: Rust MCP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript SDK dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Rust 1.91.1 with quality components
        shell: bash
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt,clippy
          rustup default 1.91.1
      - name: Check JavaScript-to-Rust tool contract drift
        run: node rust-mcp/scripts/check-contract-parity.mjs
      - name: Check formatting
        run: cargo fmt --manifest-path rust-mcp/Cargo.toml -- --check
      - name: Run strict Clippy
        run: cargo clippy --manifest-path rust-mcp/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows hosted runners can stall many simultaneous native child launches.
            # Keep unit subprocess tests deterministic; the dedicated contention smoke below
            # remains the explicit concurrent scheduler/watcher regression gate.
            cargo test --manifest-path rust-mcp/Cargo.toml --locked -- --test-threads=2
          else
            cargo test --manifest-path rust-mcp/Cargo.toml --locked
          fi
      - name: Validate Windows managed cutover contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci/test-windows-startup-contract.ps1
          ./scripts/ci/test-windows-managed-mcp-ownership.ps1
      - name: Build Rust MCP shadow binary
        run: cargo build --manifest-path rust-mcp/Cargo.toml --locked
      - name: Reproduce Windows watcher contention and hard-deadline contract
        if: runner.os == 'Windows'
        run: node rust-mcp/scripts/windows-contention-smoke-runner.mjs
      - name: Run Rust HTTP, auth, and disconnect regression smokes
        run: |
          node rust-mcp/scripts/config-parity-smoke-runner.mjs
          node rust-mcp/scripts/gateway-smoke-runner.mjs
          node rust-mcp/scripts/oauth-smoke-runner.mjs
          node rust-mcp/scripts/cloudflare-oauth-smoke-runner.mjs
          node rust-mcp/scripts/disconnect-smoke-runner.mjs
      - name: Verify exact JavaScript-to-Rust tool schema parity (host)
        run: node rust-mcp/scripts/schema-parity-audit.mjs
      - name: Verify exact JavaScript-to-Rust tool schema parity (Docker profile)
        env:
          SCHEMA_PARITY_RUNTIME_MODE: docker
        run: node rust-mcp/scripts/schema-parity-audit.mjs
      - name: Verify schemas stay valid under constrained limits
        env:
          SCHEMA_PARITY_MAX_TEXT_OUTPUT_CHARS: "50"
          SCHEMA_PARITY_MAX_COMMAND_OUTPUT_CHARS: "50"
          SCHEMA_PARITY_MAX_MCP_TRANSFER_CHARS: "1"
          SCHEMA_PARITY_MCP_WAIT_MAX_SECONDS: "1"
        run: node rust-mcp/scripts/schema-parity-audit.mjs
      - name: Verify transfer-limit unlimited schema parity
        env:
          SCHEMA_PARITY_MAX_MCP_TRANSFER_CHARS: unlimited
        run: node rust-mcp/scripts/schema-parity-audit.mjs
      - name: Verify JavaScript-to-Rust observable result parity
        env:
          RUST_MCP_RESULT_SKIP_DISPLAY: "1"
        run: node rust-mcp/scripts/result-parity-audit.mjs
      - name: Run JavaScript MCP SDK interoperability smoke
        run: node rust-mcp/scripts/smoke-runner.mjs


  msrv:
    name: Rust MCP MSRV (1.88.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install declared MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Verify declared MSRV still compiles
        run: cargo +1.88.0 check --manifest-path rust-mcp/Cargo.toml --locked

  dependency-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust lockfile against RustSec
        working-directory: rust-mcp
        run: cargo audit
