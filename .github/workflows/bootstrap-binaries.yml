name: Build and release C++ binaries

on:
  push:
    tags: ['bootstrap-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release version before certification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require a matching source version for release tags
        shell: bash
        run: |
          version=$(tr -d '\r\n' < cpp-bootstrap/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid bootstrap version'; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "bootstrap-v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match source version $version"
            exit 1
          fi

  certify:
    name: Certify every C++ runtime and installer
    needs: preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/cpp-runtime.yml

  chrome-bridge:
    name: Qualify the optional Windows Chrome bridge
    needs: preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/chrome-bridge.yml

  release:
    name: Publish immutable C++ release
    if: startsWith(github.ref, 'refs/tags/bootstrap-v')
    needs: [certify, chrome-bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cpp-release-assets
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: devbox-chrome-bridge-windows-x86_64
          path: release-assets
      - name: Verify packaged release checksums
        working-directory: release-assets
        run: |
          sha256sum --strict --check SHA256SUMS
          sha256sum --strict --check chrome-bridge-SHA256SUMS
      - name: Verify bridge provenance before publication
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in devbox-chrome-bridge-*-windows-x86_64.zip chrome-bridge-manifest.json chrome-bridge-SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/chrome-bridge.yml" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners --bundle chrome-bridge-provenance.sigstore.json
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Native C++ Devbox MCP server, command-line installer, and setup TUI.

          Desktop packages: Windows x86-64, Linux x86-64/ARM64, macOS Intel/Apple Silicon,
          plus a native musl package for Alpine Linux x86-64.
          Android API 21 builds: arm64-v8a, armeabi-v7a, x86_64, and x86.
          Android runtime certification runs in real Termux x86-64 userspace.

          Full archives contain all three native executables and their build manifest.
          Full desktop/offline bundles also include a verified optional ripgrep fallback,
          built from pinned source without PCRE2. Host rg takes precedence.
          Separate devbox-core-TARGET archives contain only the server/native management
          executable, documentation, manifest and dependency notices. Core startup and
          supervision require no Node/npm/Git, compiler, browser or desktop packages.
          Native offline installers bundle the server, setup/TUI, manifests and notices.
          Windows EXE/ZIP installs with current-user privileges; Linux x86-64/ARM64
          uses a self-extracting .run executable; macOS uses an app bundle ZIP.
          devbox-offline-universal.zip collects all five desktop installer targets
          and their manifests/guides into one portable offline distribution.
          These installers verify and unpack locally without gh, a package manager,
          an external archiver or installation-time downloads. Use --portable PATH
          for a new user-owned directory, or --user for the current-user default.
          Core offline packages do not bundle Chromium or a Cloudflare tunnel.
          SHA256SUMS and build-provenance.json cover the standalone binaries and archives.
          Packaged installation does not require Rust or a C++ compiler.
          Node, Python and a Docker engine are not bundled.
          The optional devbox-chrome-bridge-VERSION-windows-x86_64.zip adds a Rust
          native messaging/MCP host and a Chrome extension for explicitly granted
          tabs. Its separate manifest, SHA256SUMS and Sigstore bundle authenticate
          that package; it is not a dependency of the core server or other platforms.
          Load the extension through Chrome's normal permission review and grant
          individual tabs. The C++ adapter requires operator executable/hash pins.
          Version-specific changes are documented in the tagged source's docs/releases directory.

          Canonical Termux app: https://github.com/adybag14-cyber/termux-app
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate published versioned assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Devbox C++ $GITHUB_REF_NAME" --notes-file release-notes.md --latest
