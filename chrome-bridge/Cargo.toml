[package]
name = "devbox-chrome-bridge"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "User-scoped Chrome native messaging and MCP bridge for Devbox"

[dependencies]
serde_json = "=1.0.154"
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.3.4"
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
