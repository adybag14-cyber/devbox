<!doctype html><html><head><meta charset="utf-8"><title>Devbox Chrome Bridge</title><link rel="stylesheet" href="popup.css"></head><body><h1>Devbox Chrome Bridge</h1><p>Share only the current tab with your local agent and configured Devbox. Access expires after one hour, on cross-origin navigation, or when revoked.</p><p>The bridge can read, screenshot, click and type in granted tabs. Browser pages remain untrusted.</p><label><input id="new-tabs" type="checkbox"> Also allow new tabs on this same site</label><button id="connect">Connect Rust host</button><button id="grant">Allow this tab for one hour</button><button id="revoke">Revoke all tabs</button><pre id="status" role="status"></pre><script src="popup.mjs" type="module"></script></body></html>
